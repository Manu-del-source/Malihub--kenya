name: MaliHub quality checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: malihub-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-quality:
    name: Frontend tests, types, lint, Prisma and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: test
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_APP_NAME: MaliHub Kenya
      NEXT_PUBLIC_SUPABASE_URL: https://legacy-placeholder.supabase.co
      NEON_AUTH_BASE_URL: https://auth-placeholder.example.test
      NEON_AUTH_COOKIE_SECRET: ci-only-secret-value-at-least-32-characters
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/malihub_ci
      DIRECT_URL: postgresql://ci:ci@127.0.0.1:5432/malihub_ci
      PAYSTACK_CALLBACK_URL: https://example.test/checkout/payment-result
      PAYSTACK_TIMEOUT_MS: "15000"
      DROPSHIPPING_PAYMENT_FEE_BPS: "0"
      DROPSHIPPING_TAX_BPS: "0"
      DROPSHIPPING_FEE_CONFIG_VERIFIED: "false"
      DROPSHIPPING_STOCK_MAX_AGE_HOURS: "48"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Run unit and regression tests
        run: npm test

      - name: Check TypeScript
        run: npm run type-check

      - name: Check lint
        run: npm run lint

      - name: Build application
        run: npm run build
