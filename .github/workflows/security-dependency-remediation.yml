name: Security dependency remediation

on:
  push:
    branches:
      - security/dependabot-remediation
    paths:
      - ".github/workflows/security-dependency-remediation.yml"

permissions:
  contents: write

concurrency:
  group: security-dependency-remediation
  cancel-in-progress: false

jobs:
  patch-next:
    runs-on: ubuntu-latest
    steps:
      - name: Check out remediation branch
        uses: actions/checkout@v4
        with:
          ref: security/dependabot-remediation
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Update patched Next.js 15 packages and lockfile
        run: npm install --save-exact --package-lock-only --ignore-scripts next@15.5.29 eslint-config-next@15.5.29

      - name: Install locked dependencies
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/malihub_ci
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/malihub_ci
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Commit dependency manifest and lockfile
        if: always()
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency file changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "fix(security): patch Next.js 15 dependencies"
          git push origin security/dependabot-remediation
