name: Application CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: application-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/malihub_ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/malihub_ci
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies and generate Prisma Client
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: TypeScript
        run: npm run type-check

      - name: ESLint
        run: npm run lint

      - name: Test suite
        run: npm test
